<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<script src="https://accounts.google.com/gsi/client"></script>
<meta name="theme-color" content="#34C759">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sheet Widget</title>
<style>
  :root{
    --green:#34C759; --green-d:#248A3D; --ink:#1c1c1e; --sub:#6b7280;
    --bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink)}

  /* --- Googleのpickerダイアログを全画面に --- */
  .picker-dialog{left:0!important;top:0!important;right:0!important;bottom:0!important;
    width:100%!important;height:100%!important;border:none!important;box-shadow:none!important}
  .picker-dialog-bg{display:none!important}

  /* --- アプリと同じデザインのオーバーレイ画面 --- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:0 40px;text-align:center;
    background:var(--bg)}
  .screen.hidden{display:none}

  .logo{width:88px;height:88px;border-radius:20px;display:block;
    box-shadow:0 10px 26px rgba(52,199,89,.32)}

  .title{font-size:20px;font-weight:700;letter-spacing:.2px}
  .sub{font-size:14px;color:var(--sub);line-height:1.6;max-width:300px}

  .spin{width:26px;height:26px;border:3px solid #e6f7ec;border-top-color:var(--green);
    border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .spin.hidden{display:none}

  .emoji{font-size:46px;line-height:1}
  .btn{appearance:none;border:none;cursor:pointer;width:100%;max-width:300px;
    background:var(--green);color:#fff;font-size:16px;font-weight:700;
    padding:15px 20px;border-radius:14px;font-family:inherit;
    box-shadow:0 6px 16px rgba(52,199,89,.3);transition:transform .08s,background .15s}
  .btn:active{transform:scale(.98);background:var(--green-d)}
  .btn.hidden{display:none}
  .link{appearance:none;border:none;background:none;cursor:pointer;
    color:var(--sub);font-size:14.5px;font-family:inherit;padding:8px}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div class="screen" id="ready">
  <img class="logo" src="/apple-touch-icon.png" width="88" height="88" alt="Sheet Widget">
  <div class="title" id="readyTitle"></div>
  <div class="sub" id="readySub"></div>
  <div class="spin hidden" id="spin"></div>
  <button class="btn" id="openBtn"></button>
</div>

<!-- エラー／時間切れ -->
<div class="screen hidden" id="error">
  <div class="emoji">📄</div>
  <div class="title" id="errTitle"></div>
  <div class="sub" id="errText"></div>
  <button class="btn" id="retryBtn"></button>
  <button class="link" id="cancelBtn"></button>
</div>

<script>
(function(){
  'use strict';
  var CB = 'sheetwidgetpicker://';

  // ポップアップでのログイン専用のウェブクライアント（iOSクライアントは https へ返せないため別途必要）。
  // ファイルの利用許可は setAppId（プロジェクト番号）単位なので、
  // ここで選んだファイルはアプリ側の iOS クライアントからも読める。
  var WEB_CLIENT_ID = '966661342666-0jkulmn0ua8dmkcov9ccati9g639s65p.apps.googleusercontent.com';

  // このページはアプリの一部として全対応言語のユーザーに表示される。
  // 言語はアプリが locale= で渡す（アプリの対応7言語すべてを持つ）。
  // アプリに言語を足したらここにも足すこと。無い言語は英語に落ちる。
  var STRINGS = {
    ja: { title:'スプレッドシートを選択',
          sub:'Google でログインすると、<br>シートの一覧が表示されます。',
          btn:'Google でログインして選ぶ',
          cancelled:'ログインをキャンセルしました。<br>もう一度お試しください。',
          loadTitle:'読み込めませんでした',
          loadText:'通信環境を確認して、もう一度お試しください。',
          appTitle:'このページはアプリ専用です',
          appText:'Sheet Widget アプリの「＋」から開いてください。',
          retry:'もう一度試す', back:'アプリに戻る' },
    en: { title:'Choose a spreadsheet',
          sub:'Sign in with Google to see<br>your spreadsheets.',
          btn:'Sign in with Google',
          cancelled:'Sign-in was cancelled.<br>Please try again.',
          loadTitle:'Couldn’t load',
          loadText:'Check your connection and try again.',
          appTitle:'This page is part of the app',
          appText:'Open it with the “+” button in Sheet Widget.',
          retry:'Try again', back:'Back to the app' },
    ko: { title:'스프레드시트 선택',
          sub:'Google 계정으로 로그인하면<br>스프레드시트 목록이 표시됩니다.',
          btn:'Google 계정으로 로그인',
          cancelled:'로그인을 취소했습니다.<br>다시 시도해 주세요.',
          loadTitle:'불러오지 못했습니다',
          loadText:'네트워크 상태를 확인한 후 다시 시도해 주세요.',
          appTitle:'앱 전용 페이지입니다',
          appText:'Sheet Widget 앱의 ‘+’ 버튼에서 열어 주세요.',
          retry:'다시 시도', back:'앱으로 돌아가기' },
    'zh-TW': { title:'選擇試算表',
          sub:'使用 Google 帳戶登入後，<br>即會顯示試算表清單。',
          btn:'使用 Google 帳戶登入',
          cancelled:'已取消登入，<br>請再試一次。',
          loadTitle:'無法載入',
          loadText:'請檢查網路連線後再試一次。',
          appTitle:'此頁面為App專用',
          appText:'請從 Sheet Widget 的「＋」按鈕開啟。',
          retry:'再試一次', back:'返回App' },
    es: { title:'Elige una hoja de cálculo',
          sub:'Inicia sesión con Google para ver<br>tus hojas de cálculo.',
          btn:'Iniciar sesión con Google',
          cancelled:'Has cancelado el inicio de sesión.<br>Inténtalo de nuevo.',
          loadTitle:'No se pudo cargar',
          loadText:'Comprueba tu conexión e inténtalo de nuevo.',
          appTitle:'Esta página es parte de la app',
          appText:'Ábrela con el botón «+» de Sheet Widget.',
          retry:'Intentar de nuevo', back:'Volver a la app' },
    de: { title:'Tabelle auswählen',
          sub:'Melde dich mit Google an,<br>um deine Tabellen zu sehen.',
          btn:'Mit Google anmelden',
          cancelled:'Anmeldung abgebrochen.<br>Bitte versuche es erneut.',
          loadTitle:'Laden fehlgeschlagen',
          loadText:'Prüfe deine Verbindung und versuche es erneut.',
          appTitle:'Diese Seite gehört zur App',
          appText:'Öffne sie über die Schaltfläche „+“ in Sheet Widget.',
          retry:'Erneut versuchen', back:'Zurück zur App' },
    fr: { title:'Choisir une feuille de calcul',
          sub:'Connectez-vous avec Google pour voir<br>vos feuilles de calcul.',
          btn:'Se connecter avec Google',
          cancelled:'Connexion annulée.<br>Veuillez réessayer.',
          loadTitle:'Échec du chargement',
          loadText:'Vérifiez votre connexion et réessayez.',
          appTitle:'Cette page fait partie de l’app',
          appText:'Ouvrez-la avec le bouton « + » de Sheet Widget.',
          retry:'Réessayer', back:'Retour à l’app' }
  };

  var readyScreen = document.getElementById('ready');
  var readySub = document.getElementById('readySub');
  var errBox   = document.getElementById('error');
  var errText  = document.getElementById('errText');
  var errTitle = document.getElementById('errTitle');
  var spin     = document.getElementById('spin');
  var openBtn  = document.getElementById('openBtn');
  var built = false, stalled = false, watchdog = null;

  // パラメータ（アプリから location.hash で受領。# 以降はサーバーへ送信されない）
  // 開いた瞬間のフラグメントを控えておく。「もう一度試す」でここへ戻るため。
  // Googleのログインを挟むとフラグメントが失われることがあり、その状態で
  // 再読み込みするとパラメータ不足のエラーに落ちて二度と抜けられなくなる。
  var ORIGINAL_HASH = location.hash;
  var params = {};
  location.hash.slice(1).split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });

  var T = STRINGS[params.locale] || STRINGS.en;
  document.documentElement.lang = (params.locale === 'zh-TW') ? 'zh-Hant' : (params.locale || 'en');
  document.getElementById('readyTitle').textContent = T.title;
  readySub.innerHTML = T.sub;
  openBtn.textContent = T.btn;
  document.getElementById('retryBtn').textContent = T.retry;
  document.getElementById('cancelBtn').textContent = T.back;

  // アプリへ戻る。SFSafariViewController はアプリ側が閉じる。
  function back(path){ location.replace(CB + path); }

  function showError(title, msg){
    stalled = true;
    if (watchdog){ clearTimeout(watchdog); watchdog = null; }
    readyScreen.classList.add('hidden');
    errTitle.textContent = title;
    errText.textContent  = msg;
    errBox.classList.remove('hidden');
  }
  function showLoadError(){ showError(T.loadTitle, T.loadText); }

  // reload ではなく、控えておいたフラグメント付きで開き直す。
  // reload だとフラグメントが欠けたまま同じ画面に戻り、さらに直前がPOSTの結果だと
  // Safari が「このメッセージは期限切れです」を挟んで詰む。replace なら常にGETで入り直す。
  document.getElementById('retryBtn').onclick  = function(){
    location.replace(location.pathname + ORIGINAL_HASH);
  };
  document.getElementById('cancelBtn').onclick = function(){ back('cancel'); };

  // アクセストークンはこのページが自分で取得する（下記 startLogin）。
  // アプリから受け取るのは Picker の構築に要るものだけ。
  if (!params.key || !params.appId) {
    // ここは再試行しても結果が変わらない（アプリから開き直すしか道がない）。
    // 押しても同じ画面に戻るだけのボタンを出すと、抜け道が無いように見える。
    document.getElementById('retryBtn').classList.add('hidden');
    showError(T.appTitle, T.appText);
    return;
  }

  window.addEventListener('error', function(){
    if (!built && !stalled) showLoadError();
  });

  // ボタンは最初から出ているので、api.js の読み込みでタップを待たせない。
  // ログイン(数秒)の裏で読み終わるため、トークンが来た時点でほぼ常に準備済み。
  var pickerReady = false, buildWhenReady = false;

  window.__onApiLoad = function(){
    gapi.load('picker', {
      callback: function(){
        pickerReady = true;
        if (buildWhenReady){ buildWhenReady = false; createPicker(); }
      },
      onerror: showLoadError
    });
  };

  function showOpenButton(){
    if (watchdog){ clearTimeout(watchdog); watchdog = null; }
    spin.classList.add('hidden');
    openBtn.classList.remove('hidden');
  }

  // 開くたびに Google のログイン(ポップアップ)を挟んでから picker を構築する。
  //
  // なぜ毎回ログインさせるのか：
  //   Picker は自社ページ上の docs.google.com iframe（＝第三者）で動くため、
  //   ITP（サイト越えトラッキングを防ぐ・iOS標準ON）下では Cookie アクセスが必要になる。
  //   その付与はページ読み込みごとに、しかもユーザー操作の直後でしか通らない。
  //   ところが Picker は一度付与されると自前の許可UIを出さなくなり、以降ずっと
  //   「アカウントにアクセスできません」で行き止まる（＝2回目以降が必ず死ぬ）。
  //   一方 WebKit には「第一者ページから開いたポップアップ内でユーザーがタップすると、
  //   その第三者が一時的な Cookie アクセスを得る」という互換仕様がある。
  //   https://webkit.org/blog/10218/full-third-party-cookie-blocking-and-more/
  //   GIS のログインはまさにそのポップアップなので、毎回ログインさせれば毎回
  //   アクセスを取り直せて、Picker の「一度きり」問題が構造的に消える。
  //   （Google 公式の Picker 実装例も GIS + Picker のこの組み合わせ）
  //
  // このタップは省略できない：ポップアップはユーザー操作の直後にしか開けず、
  // アプリの「＋」タップはこの文書に活性化を持ち込めない（＝popup_failed_to_open）。
  var tokenClient = null, accessToken = null;
  // ログインしたメールアドレス（分かれば）。アプリ側が「Picker で選ばれた
  // アカウントと、実際にシートを取りに行くアカウントが違う」ケースを検知して
  // 案内を出すために使う。取得できなくても選択自体は今まで通り進む。
  var pickedEmail = null;

  // userinfo は軽量な非重要スコープ（email）だけを追加要求して取得する。
  // 失敗しても致命的ではない（pickedEmail が null のままフォールバック）ので、
  // ピッカーの構築を待たせず並行して取りに行く。
  function fetchPickedEmail(token){
    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + token }
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j && j.email) pickedEmail = j.email; })
      .catch(function(){});
  }

  function startLogin(){
    openBtn.classList.add('hidden');
    spin.classList.remove('hidden');
    disposePicker();
    try {
      if (!tokenClient) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: WEB_CLIENT_ID,
          // drive.file に加えて email（非機密スコープ・審査不要）も要求し、
          // 「どのアカウントで選んだか」をアプリへ返せるようにする。
          scope: 'https://www.googleapis.com/auth/drive.file email',
          callback: function(resp){
            if (resp && resp.access_token) {
              accessToken = resp.access_token;
              pickedEmail = null;
              fetchPickedEmail(accessToken);
              if (pickerReady) createPicker(); else buildWhenReady = true;
            } else {
              showOpenButton();
              readySub.innerHTML = T.cancelled;
            }
          },
          error_callback: function(){
            // popup_failed_to_open 等。タップからなら開けるのでボタンに戻す。
            showOpenButton();
            readySub.innerHTML = T.sub;
          }
        });
      }
      // 毎回アカウント選択を出す（＝ポップアップ内のタップが Cookie アクセスの条件）。
      // hint があれば（アプリの現在のアクティブアカウント）候補として優先表示させ、
      // アプリ側のアカウントと違うアカウントを誤って選んでしまう事故を減らす。
      var opts = { prompt: 'select_account' };
      if (params.hint) opts.login_hint = params.hint;
      tokenClient.requestAccessToken(opts);
    } catch (e) {
      showLoadError();
    }
  }

  openBtn.onclick = startLogin;

  // 前回の(失敗した)pickerダイアログを完全に取り除く。
  // 残っていると次の構築が壊れた画面のまま表示されてしまう。
  var currentPicker = null;
  function disposePicker(){
    if (currentPicker) {
      try { currentPicker.setVisible(false); currentPicker.dispose(); } catch (e) {}
      currentPicker = null;
    }
    ['.picker-dialog', '.picker-dialog-bg'].forEach(function(sel){
      Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){
        el.parentNode && el.parentNode.removeChild(el);
      });
    });
  }

  // 成功は Picker の LOADED コールバックだけで判定する。
  // Googleの「アカウントにアクセスできません」エラーも .picker-dialog として
  // 描画されるため、DOMの有無では成否を区別できない。
  function watchForPicker(){
    var tries = 0;
    var iv = setInterval(function(){
      if (built) { clearInterval(iv); return; }
      if (++tries >= 14) {   // ~7秒 LOADEDが来ない
        clearInterval(iv);
        disposePicker();
        showLoadError();
      }
    }, 500);
  }

  // Picker の対応表記に合わせる。STRINGS に無い言語は Picker 本体も英語にする
  // （文言だけ英語で Picker が別言語、という食い違いを避けるため）
  function pickerLocale(){
    return STRINGS[params.locale] ? params.locale : 'en';
  }

  function createPicker(){
    try {
      var view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
        .setMode(google.picker.DocsViewMode.LIST)
        .setIncludeFolders(false);
      if (params.fileIds) view.setFileIds(params.fileIds);

      currentPicker = new google.picker.PickerBuilder()
        .setOAuthToken(accessToken)
        .setDeveloperKey(params.key)
        .setAppId(params.appId)
        .setOrigin(location.protocol + '//' + location.host)
        .setLocale(pickerLocale())
        .setSelectableMimeTypes('application/vnd.google-apps.spreadsheet')
        .addView(view)
        .setCallback(function(data){
          var R = google.picker.Response, A = google.picker.Action;
          var action = data[R.ACTION];
          if (action === A.PICKED) {
            var doc = data[R.DOCUMENTS][0];
            back('picked?id=' + encodeURIComponent(doc[google.picker.Document.ID]) +
                 '&name=' + encodeURIComponent(doc[google.picker.Document.NAME] || '') +
                 '&email=' + encodeURIComponent(pickedEmail || ''));
          } else if (action === A.CANCEL) {
            back('cancel');
          } else if (action === A.LOADED) {
            built = true;
            if (watchdog){ clearTimeout(watchdog); watchdog = null; }
            readyScreen.classList.add('hidden');
            errBox.classList.add('hidden');
          }
        })
        .build();
      currentPicker.setVisible(true);
      watchForPicker();
    } catch (e) {
      showLoadError();
    }
  }

  var s = document.createElement('script');
  s.src = 'https://apis.google.com/js/api.js?onload=__onApiLoad';
  s.onerror = showLoadError;
  document.head.appendChild(s);

  // api.js が沈黙した場合の救済（12秒）。ボタンが出ている間は待たせていないので何もしない。
  watchdog = setTimeout(function(){
    if (!built && !stalled && openBtn.classList.contains('hidden')) showLoadError();
  }, 12000);
})();
</script>
</body>
</html>
